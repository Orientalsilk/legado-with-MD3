name: Verify

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**/modules/web/**'
  pull_request:
    paths-ignore:
      - '**/modules/web/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 个人日常使用只维护 Core 基础版。
  verify:
    name: Verify (core)
    runs-on: ubuntu-latest
    concurrency:
      group: verify-${{ github.workflow }}-${{ github.ref }}-core
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare pinned UI forks
        uses: ./.github/actions/prepare-ui-forks

      # 与 auto-release.yml 同一处理：settings.gradle 里的 aliyun 镜像面向国内开发机，
      # 在 GitHub runner 上会 502，且 Gradle 一旦判定某仓库失败就整个禁用它。
      - name: Remove Aliyun mirrors (unreliable in CI)
        run: |
          sed -i '/maven.aliyun.com/d' settings.gradle

      # Reader semantic golden/contract/consumer/file tests are discovered by the
      # same unfiltered JVM task, preserving per-class Robolectric isolation.
      # 架构检查只跑一次，挂在 core job 上。
      # 依赖解析命中 Maven Central 限流（HTTP 429）时自动重试一次；真实编译/测试失败不重试。
      - name: Run semantic compatibility, unit tests, lint, architecture check, and debug build
        run: |
          chmod +x gradlew
          bash scripts/run-gradle-with-retry.sh ./gradlew \
            testAppCoreDebugUnitTest \
            lintAppCoreDebug \
            verifyConfigArchitecture \
            assembleAppCoreDebug \
            compileAppCoreDebugAndroidTestKotlin \
            --continue \
            --no-daemon \
            --no-configuration-cache

      - name: Upload unit test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: verify-unit-test-reports-core
          if-no-files-found: warn
          path: |
            app/build/test-results/testAppCoreDebugUnitTest/**
            app/build/reports/tests/testAppCoreDebugUnitTest/**

      - name: Upload lint reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: verify-lint-reports-core
          if-no-files-found: warn
          path: |
            app/build/reports/lint-results-appCoreDebug.html
            app/build/reports/lint-results-appCoreDebug.xml
            app/build/reports/lint-results-appCoreDebug.txt
            app/build/reports/lint-results-appCoreDebug.sarif
